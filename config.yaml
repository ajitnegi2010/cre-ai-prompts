model:
  name: claude-sonnet-4-5          # change to any model you have API access to
  max_tokens: 3000

limits:
  max_items_per_agent: 25          # news items passed to each agent (controls API cost)
  max_age_days: 3                  # ignore older news

# Free sources. Add your own Google Alerts RSS URLs under google_alerts.
# Google Alerts: create alert -> Deliver to "RSS feed" -> copy the feed URL.
sources:
  google_alerts: []
  rss:
    occupier:
      - https://news.google.com/rss/search?q=GCC+India+launch+Mumbai+OR+Pune+OR+Bengaluru+when:3d&hl=en-IN&gl=IN&ceid=IN:en
      - https://news.google.com/rss/search?q=funding+round+India+startup+office+expansion+when:3d&hl=en-IN&gl=IN&ceid=IN:en
      - https://news.google.com/rss/search?q=India+entry+office+Mumbai+company+announces+when:3d&hl=en-IN&gl=IN&ceid=IN:en
      - https://news.google.com/rss/search?q=merger+acquisition+India+company+restructuring+when:3d&hl=en-IN&gl=IN&ceid=IN:en
      - https://news.google.com/rss/search?q=hiring+expansion+Mumbai+headcount+when:3d&hl=en-IN&gl=IN&ceid=IN:en
    supply:
      - https://news.google.com/rss/search?q=Mumbai+office+space+new+development+OR+launch+OR+completion+when:3d&hl=en-IN&gl=IN&ceid=IN:en
      - https://news.google.com/rss/search?q=Navi+Mumbai+OR+Thane+commercial+office+project+when:3d&hl=en-IN&gl=IN&ceid=IN:en
      - https://news.google.com/rss/search?q=flex+space+OR+coworking+OR+managed+office+Mumbai+when:3d&hl=en-IN&gl=IN&ceid=IN:en
    market:
      - https://news.google.com/rss/search?q=Mumbai+office+leasing+rentals+absorption+vacancy+when:3d&hl=en-IN&gl=IN&ceid=IN:en
      - https://news.google.com/rss/search?q=India+office+market+REIT+leasing+when:3d&hl=en-IN&gl=IN&ceid=IN:en
      - https://news.google.com/rss/search?q=RBI+OR+MahaRERA+OR+Maharashtra+stamp+duty+commercial+property+when:3d&hl=en-IN&gl=IN&ceid=IN:en
